name: Native undefined-behavior checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CYCLONEDDS_URI: '<CycloneDDS><Domain><General><Interfaces><NetworkInterface address="127.0.0.1"/></Interfaces><AllowMulticast>false</AllowMulticast></General><Discovery><ParticipantIndex>auto</ParticipantIndex><Peers><Peer Address="127.0.0.1"/></Peers></Discovery></Domain></CycloneDDS>'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Build core master or matching release tag and binding with UBSan
        env:
          CYCLONEDDS_CORE_REF: ${{ github.ref_type == 'tag' && format('refs/tags/{0}', github.ref_name) || 'refs/heads/master' }}
        shell: bash
        run: |
          FLAGS='-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer'
          git init "$RUNNER_TEMP/core"
          git -C "$RUNNER_TEMP/core" remote add origin https://github.com/eclipse-cyclonedds/cyclonedds.git
          git -C "$RUNNER_TEMP/core" fetch --depth 1 origin "$CYCLONEDDS_CORE_REF"
          git -C "$RUNNER_TEMP/core" checkout --detach FETCH_HEAD
          echo "Cyclone DDS core ref: $CYCLONEDDS_CORE_REF"
          git -C "$RUNNER_TEMP/core" rev-parse HEAD
          cmake -S "$RUNNER_TEMP/core" -B "$RUNNER_TEMP/core-build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/core-install" -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_C_FLAGS=$FLAGS" -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SECURITY=OFF -DENABLE_SSL=OFF
          cmake --build "$RUNNER_TEMP/core-build" --parallel 4
          cmake --install "$RUNNER_TEMP/core-build"
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/core-install" \
            -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=$FLAGS" -DBUILD_EXAMPLES=OFF
          cmake --build build --parallel 4
      - name: Run functional and resource stress tests
        run: ctest --test-dir build --output-on-failure -j 2 --output-junit test-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ubsan-diagnostics
          path: |
            build/Testing/Temporary/*.log
            build/test-results.xml
          if-no-files-found: ignore
