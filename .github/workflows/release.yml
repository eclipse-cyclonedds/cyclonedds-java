name: Release to Maven Central
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and verify universal artifacts
    uses: ./.github/workflows/universal.yml

  publish:
    name: Publish release to Maven Central
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MAVEN_ARGS: --settings "${{ github.workspace }}/.github/maven-settings.xml"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
          overwrite-settings: false
          cache: maven
          cache-dependency-path: |
            pom.xml
            maven/pom.xml
            src/buildtools/pom.xml
            .github/maven-settings.xml
      # The Central publishing extension requires Maven 3.
      - uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: '3.9.9'
      - uses: actions/download-artifact@v8
        with:
          name: universal-java
          path: release
      - name: Sign and publish the verified universal artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        shell: bash
        run: |
          for KEY in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD GPG_KEY_ID MAVEN_GPG_PASSPHRASE; do
            if [ -z "${!KEY}" ]; then echo "::error::Missing publishing environment variable: $KEY"; exit 1; fi
          done
          python3 scripts/check-release-tag.py "$RELEASE_TAG"
          VERSION=$RELEASE_TAG
          mvn -B -ntp -f maven/pom.xml -Prelease-artifacts,central-release \
            "-Dcyclonedds.runtime.jar=$PWD/release/org.eclipse.cyclonedds-${VERSION}.jar" \
            "-Dcyclonedds.idlc.verifiedJar=$PWD/release/org.eclipse.cyclonedds.idlc-${VERSION}.jar" \
            "-Dgpg.keyname=$GPG_KEY_ID" deploy
      - name: Save signed deployment bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-central-deployment
          path: '**/target/central-publishing/*.zip'
          if-no-files-found: ignore
